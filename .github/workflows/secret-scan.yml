name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history; required so the scan sees all pushed commits, not just HEAD

      # Pinned to a specific commit SHA so the template doesn't drift under us.
      # SHA resolves gitleaks-action@v3 (== v3.0.0) as of 2026-05-31.
      # Verified via `gh api repos/gitleaks/gitleaks-action/git/matching-refs/tags/v3`:
      # both the rolling v3 tag and v3.0.0 point at this commit, type "commit"
      # (no annotated-tag-object hop required).
      #
      # On version cadence: gitleaks-action major versions are tied to GitHub's
      # Node runtime lifecycle. This file will need a deliberate bump roughly
      # whenever GitHub retires a Node version — it is NOT a "set it and forget
      # it" file. Bumping is forced by the runner, not optional.
      #
      # Why v3 today (the lifecycle that forced this choice; dates verified
      # against a GitHub Actions runner annotation on 2026-06-03):
      #   - gitleaks-action@v2 runs on Node 20.
      #   - 2026-06-16: GitHub switches the runner default to Node 24.
      #     Workflows using Node 20 actions then require
      #     ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true to keep running.
      #   - 2026-09-16: Node 20 is removed from GitHub-hosted runners
      #     entirely; Node 20 actions stop working.
      # v3 is the next major after gitleaks-action@v2; pinning to v3 now
      # avoids both gates.
      #
      # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      #
      # TODO (by 2026-09-16): actions/checkout@v4 also runs on Node 20
      # per the runner's own deprecation annotation. Bump to a checkout
      # version that targets Node 24 before the September retirement.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is NOT needed for personal-account repos.
          # If this template is ever cloned into an ORGANIZATION repo, the
          # action will require a license (free Starter tier covers 1 repo).
          # Set GITLEAKS_LICENSE as a repo secret and uncomment:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
